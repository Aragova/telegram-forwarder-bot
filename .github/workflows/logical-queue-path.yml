name: Python Tests

on:
  pull_request:
    paths:
      - 'app/**'
      - 'bot.py'
      - 'support_bot.py'
      - 'tests/**'
      - 'requirements.txt'
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          # Avoid sdist setup scripts and unexpected pip upgrades.
          python -m pip install --only-binary=:all: -r requirements.txt "pytest==9.0.3"

      - name: Compile project
        run: python -m compileall app bot.py support_bot.py tests

      - name: Run all tests
        run: pytest -q tests/
