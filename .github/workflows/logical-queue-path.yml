name: Python Tests

on:
  pull_request:
    paths:
      - 'app/**'
      - 'bot.py'
      - 'support_bot.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/requirements/**'
      - '.github/workflows/logical-queue-path.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements/build.lock.txt
          # pyaes 1.6.1 is a verified sdist; build isolation is disabled to use the locked build tools.
          python -m pip install --require-hashes --only-binary=:all: --no-binary=pyaes --no-build-isolation -r .github/requirements/tests.lock.txt
          python -m pip check

      - name: Compile project
        run: python -m compileall app bot.py support_bot.py tests

      - name: Run all tests
        run: pytest -q tests/

  publication-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: publication_test
          POSTGRES_USER: publication_test
          # Per-run non-production credential for the isolated CI service.
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U publication_test -d publication_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install integration dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements/build.lock.txt
          python -m pip install --require-hashes --only-binary=:all: --no-binary=pyaes --no-build-isolation -r .github/requirements/tests.lock.txt -r .github/requirements/postgres.lock.txt
          python -m pip check
      - name: Verify publication ledger on real PostgreSQL
        env:
          VIMI_PUBLICATION_PG_TEST: '1'
          APP_PG_HOST: 127.0.0.1
          APP_PG_PORT: '5432'
          APP_PG_DB: publication_test
          APP_PG_USER: publication_test
          APP_PG_PASSWORD: ${{ github.run_id }}
        run: pytest -q tests/test_publication_postgres_integration.py
