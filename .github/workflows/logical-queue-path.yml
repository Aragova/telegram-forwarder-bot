name: Python Tests

on:
  pull_request:
    paths:
      - 'app/**'
      - 'bot.py'
      - 'support_bot.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/logical-queue-path.yml'
      - '.github/requirements/postgres-test.lock'
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          # Allow only pinned pyaes sdist required by Telethon; no surprise pip upgrade.
          python -m pip install --only-binary=:all: --no-binary=pyaes --no-deps --report "$RUNNER_TEMP/python-ci-report.json" -r .github/requirements/python-ci.versions
          python -m pip check
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "python-ci-report.json").read_text())
          for item in sorted(report["install"], key=lambda i: i["metadata"]["name"].lower()):
              meta = item["metadata"]
              sha = item["download_info"]["archive_info"]["hashes"]["sha256"]
              print(f"CI_LOCK {meta['name']}=={meta['version']} --hash=sha256:{sha}")
          PY

      - name: Compile project
        run: python -m compileall app bot.py support_bot.py tests

      - name: Run all tests
        run: pytest -q tests/

      - name: PostgreSQL publication contract
        run: |
          python -m pip install --only-binary=:all: --no-deps --require-hashes -r .github/requirements/postgres-test.lock
          sudo systemctl start postgresql
          pg_isready
          sudo -u postgres createuser -- "$(id -un)"
          sudo -u postgres createdb -O "$(id -un)" vimi_publication_ci
          export APP_PG_HOST=/var/run/postgresql APP_PG_PORT=5432
          export APP_PG_DB=vimi_publication_ci APP_PG_USER="$(id -un)"
          unset APP_PG_PASSWORD # local Unix socket peer authentication
          export VIMI_TEST_POSTGRES=1
          pytest -q tests/test_postgres_publication_contract.py
