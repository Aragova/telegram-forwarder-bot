name: Smoke Check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          # Use wheels only to avoid running untrusted setup.py scripts.
          python -m pip install --only-binary=:all: -r requirements.txt

      - name: Syntax check
        run: |
          python3 -m py_compile bot.py
          python3 -m py_compile app/*.py
