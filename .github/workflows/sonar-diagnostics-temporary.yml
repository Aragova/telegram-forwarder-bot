name: Temporary Sonar diagnostics

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  checks: read

jobs:
  sonar-diagnostics:
    if: github.event.pull_request.number == 525 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read previous Sonar check annotations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate 'repos/Aragova/telegram-forwarder-bot/check-runs/138449947578/annotations' --jq '.[] | {path,start_line,end_line,title,message,annotation_level}'
      - name: Get SHA256 hashes for previously tested dependency versions
        run: |
          python3 - <<'PY'
          import json
          from urllib.request import urlopen
          from concurrent.futures import ThreadPoolExecutor

          groups = json.loads("{\"tests\":[\"pyaes-1.6.1.tar.gz\",\"pytest-9.0.3-py3-none-any.whl\",\"aiogram-3.34.0-py3-none-any.whl\",\"telethon-1.46.0-py3-none-any.whl\",\"python_dotenv-1.2.4-py3-none-any.whl\",\"aiofiles-24.1.0-py3-none-any.whl\",\"httpx-0.28.1-py3-none-any.whl\",\"openpyxl-3.1.5-py2.py3-none-any.whl\",\"aiohttp-3.14.5-cp311-cp311-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl\",\"httpcore-1.0.9-py3-none-any.whl\",\"magic_filter-1.0.12-py3-none-any.whl\",\"multidict-7.2.1-cp311-cp311-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl\",\"pluggy-1.7.0-py3-none-any.whl\",\"pydantic-2.14.4-py3-none-any.whl\",\"pydantic_core-2.50.5-cp311-cp311-manylinux2014_x86_64.manylinux_2_17_x86_64.whl\",\"typing_extensions-4.16.0-py3-none-any.whl\",\"yarl-1.25.1-cp311-cp311-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl\",\"aiohappyeyeballs-2.7.1-py3-none-any.whl\",\"aiosignal-1.4.0-py3-none-any.whl\",\"annotated_types-0.8.0-py3-none-any.whl\",\"attrs-26.1.0-py3-none-any.whl\",\"certifi-2026.11.20-py3-none-any.whl\",\"frozenlist-1.8.0-cp311-cp311-manylinux1_x86_64.manylinux_2_28_x86_64.manylinux_2_5_x86_64.whl\",\"h11-0.16.0-py3-none-any.whl\",\"idna-3.20-py3-none-any.whl\",\"iniconfig-2.3.1-py3-none-any.whl\",\"packaging-26.4-py3-none-any.whl\",\"propcache-0.5.4-cp311-cp311-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl\",\"pygments-2.21.0-py3-none-any.whl\",\"typing_inspection-0.4.5-py3-none-any.whl\",\"anyio-4.16.0-py3-none-any.whl\",\"et_xmlfile-2.0.0-py3-none-any.whl\",\"rsa-4.9.1-py3-none-any.whl\",\"pyasn1-0.6.5-py3-none-any.whl\"],\"postgres\":[\"psycopg-3.2.9-py3-none-any.whl\",\"psycopg_binary-3.2.9-cp311-cp311-manylinux_2_17_x86_64.manylinux2014_x86_64.whl\"],\"audit\":[\"code2flow-2.5.1.tar.gz\",\"ruff-0.17.6-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl\",\"mypy-2.4.1-cp312-cp312-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl\",\"ast_serialize-0.13.1-cp39-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl\",\"bandit-1.9.4-py3-none-any.whl\",\"radon-6.0.1-py2.py3-none-any.whl\",\"mando-0.7.1-py2.py3-none-any.whl\",\"colorama-0.4.6-py2.py3-none-any.whl\",\"librt-0.17.0-cp312-cp312-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl\",\"mypy_extensions-1.2.0-py3-none-any.whl\",\"pathspec-1.1.1-py3-none-any.whl\",\"pyyaml-6.0.4-cp312-cp312-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl\",\"stevedore-5.10.0-py3-none-any.whl\",\"typing_extensions-4.16.0-py3-none-any.whl\",\"rich-15.0.0-py3-none-any.whl\",\"pygments-2.21.0-py3-none-any.whl\",\"markdown_it_py-4.3.0-py3-none-any.whl\",\"mdurl-0.1.2-py3-none-any.whl\",\"six-1.17.0-py2.py3-none-any.whl\"],\"build\":[\"setuptools-80.9.0-py3-none-any.whl\",\"wheel-0.45.1-py3-none-any.whl\",\"packaging-26.4-py3-none-any.whl\"]}")

          def lookup(filename):
              name, version = filename.split("-")[:2]
              if filename.endswith(".tar.gz"):
                  version = version.removesuffix(".tar.gz")
              with urlopen(f"https://pypi.org/pypi/{name}/{version}/json", timeout=30) as response:
                  data = json.load(response)
              artifact = next(row for row in data["urls"] if row["filename"] == filename and not row["yanked"])
              return f"{name.replace('_', '-')}=={version} --hash=sha256:{artifact['digests']['sha256']}"

          for group, filenames in groups.items():
              with ThreadPoolExecutor(max_workers=8) as pool:
                  lines = list(pool.map(lookup, filenames))
              for line in sorted(lines):
                  print(f"CI_LOCK_{group}: {line}")
          PY
