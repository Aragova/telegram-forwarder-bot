# Settings for SonarQube Cloud Automatic analysis (not CI-based SonarScanner).
# Python 3.11 is used by GitHub CI; production uses Python 3.12.
sonar.python.version=3.11,3.12

# Keep the complete repository in scope, but classify tests separately.
# Test inclusions also exclude these paths from the main-source scope.
sonar.sources=.
sonar.tests=tests
sonar.test.inclusions=tests/**/*
